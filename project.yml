name: StoreMesh
options:
  minimumXcodeGenVersion: 2.38.0
targets:
  storemesh-ios:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StoreMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storemesh.ios
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StoreMesh
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
