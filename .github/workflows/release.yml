name: iOS release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .release/package-lock.json
      - run: npm ci --prefix .release
      - name: Calculate SemVer and stamp platform version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --prefix .release semantic-release
      - name: Build simulator app
        run: xcodebuild -project storemesh-ios.xcodeproj -scheme storemesh-ios -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
