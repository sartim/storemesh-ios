name: iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and stamp version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          build_number=$((major * 1000000 + minor * 1000 + patch))
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $RELEASE_VERSION/g" storemesh-ios.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $build_number/g" storemesh-ios.xcodeproj/project.pbxproj
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build simulator app
        run: xcodebuild -project storemesh-ios.xcodeproj -scheme storemesh-ios -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Commit version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add storemesh-ios.xcodeproj/project.pbxproj
          git commit -m "release iOS v$RELEASE_VERSION"
          git tag "$RELEASE_TAG"
          git push origin HEAD:main "$RELEASE_TAG"
