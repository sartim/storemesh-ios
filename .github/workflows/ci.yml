name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit and UI tests
        run: >-
          xcodebuild test
          -project storemesh-ios.xcodeproj
          -scheme storemesh-ios
          # Do not pin an SDK runtime: GitHub-hosted macOS images rotate the
          # installed iOS simulator versions independently of this workflow.
          -destination 'platform=iOS Simulator,name=iPhone 16'
          CODE_SIGNING_ALLOWED=NO
