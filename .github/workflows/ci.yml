name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Do not pin an SDK runtime: GitHub-hosted macOS images rotate the
      # installed iOS simulator versions independently of this workflow.
      - name: Ensure iOS Simulator runtime is available
        run: |
          set -euo pipefail
          xcrun simctl list devices >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            echo "Simulator runtime provisioning attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1
      - name: Run unit and UI tests
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$device_id"
          xcodebuild test \
            -project StoreMesh.xcodeproj \
            -scheme storemesh-ios \
            -destination "id=$device_id" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
