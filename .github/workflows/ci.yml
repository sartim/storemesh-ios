name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit and UI tests
        run: |
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$simulator_id"
          xcodebuild test \
            -project storemesh-ios.xcodeproj \
            -scheme storemesh-ios \
            -destination "id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
